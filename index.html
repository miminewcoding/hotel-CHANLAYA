<style>
  :root{
    --ink:#1C2420;
    --ink-2:#232B27;
    --parchment:#F4EFE3;
    --paper-line:#DED4B9;
    --card:#FFFFFF;
    --brass:#B8935A;
    --brass-dark:#8F6E3E;
    --text-dark:#262B26;
    --text-mute:#6B6459;
    --text-light:#F4EFE3;
    --available:#3F7A5C;
    --available-bg:#E1EEE5;
    --occupied:#B84E3C;
    --occupied-bg:#F4E1DB;
    --cleaning:#C68F2E;
    --cleaning-bg:#F5E9D2;
    --settle:#5B7DA6;
    --settle-bg:#E4EAF2;
    --ring:#B8935A;
    --shadow: 0 6px 20px rgba(28,36,32,0.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Noto Sans Lao','Noto Sans',sans-serif;
    background:var(--parchment);
    color:var(--text-dark);
    min-height:100vh;
  }
  .num{font-family:'Fraunces',serif;font-variant-numeric:tabular-nums;}

  .console{
    background:var(--ink);
    color:var(--text-light);
    padding:14px 22px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
    border-bottom:3px solid var(--brass);
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{
    width:34px;height:34px;border-radius:50%;
    border:2px solid var(--brass);
    display:flex;align-items:center;justify-content:center;
    color:var(--brass);font-family:'Fraunces',serif;font-weight:600;font-size:16px;
  }
  .brand-text{display:flex;flex-direction:column;line-height:1.15;}
  .brand-text .title{font-family:'Fraunces',serif;font-weight:600;font-size:18px;letter-spacing:.04em;}
  .brand-text .sub{font-size:11px;color:#C9C2B3;letter-spacing:.05em;}
  .nav{display:flex;gap:6px;flex-wrap:wrap;}
  .nav button{
    background:transparent;border:1px solid rgba(244,239,227,0.25);
    color:var(--text-light);
    padding:8px 14px;border-radius:999px;
    font-family:inherit;font-size:13.5px;cursor:pointer;
    transition:all .15s ease;
  }
  .nav button:hover{border-color:var(--brass);}
  .nav button.active{background:var(--brass);border-color:var(--brass);color:var(--ink);font-weight:600;}
  .clock{font-size:12px;color:#C9C2B3;text-align:right;}

  main{max-width:1180px;margin:0 auto;padding:28px 22px 70px;}

  .floor-block{margin-bottom:34px;}
  .floor-label{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
  .floor-label .line{flex:1;height:1px;background:var(--paper-line);}
  .floor-label span{
    font-family:'Fraunces',serif;font-size:15px;letter-spacing:.06em;
    color:var(--brass-dark);text-transform:uppercase;font-weight:600;
  }

  .room-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:18px;}

  .tag{
    position:relative;background:var(--card);border-radius:14px;
    padding:16px 14px 14px;text-align:center;cursor:pointer;
    box-shadow:var(--shadow);border:3px solid rgba(0,0,0,0.08);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .tag:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(28,36,32,0.18);}
  .tag .room-no{font-family:'Fraunces',serif;font-size:28px;font-weight:600;line-height:1;margin-top:4px;}
  .tag .room-type{font-size:11px;color:var(--text-mute);margin-top:6px;line-height:1.3;}
  .tag .status-chip{
    display:inline-flex;align-items:center;gap:5px;margin-top:12px;padding:4px 10px;
    border-radius:999px;font-size:11px;font-weight:600;
  }
  .tag .status-chip .dot{width:7px;height:7px;border-radius:50%;}
  .tag.available{border-color:var(--available);}
  .tag.available .status-chip{background:var(--available-bg);color:var(--available);}
  .tag.available .status-chip .dot{background:var(--available);}
  .tag.occupied{border-color:var(--occupied);}
  .tag.occupied .status-chip{background:var(--occupied-bg);color:var(--occupied);}
  .tag.occupied .status-chip .dot{background:var(--occupied);}
  .tag.cleaning{border-color:var(--cleaning);}
  .tag.cleaning .status-chip{background:var(--cleaning-bg);color:var(--cleaning);}
  .tag.cleaning .status-chip .dot{background:var(--cleaning);}
  .tag-selected{outline:3px solid var(--brass); outline-offset:2px;}
  .tag-check{
    position:absolute; top:8px; right:8px; width:20px;height:20px;border-radius:50%;
    background:var(--brass);color:var(--ink);font-size:12px;font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .tag-overdue{box-shadow:0 0 0 3px var(--occupied);}
  .tag-overdue-badge{
    position:absolute; top:8px; left:8px; width:20px;height:20px;border-radius:50%;
    background:var(--occupied);color:#fff;font-size:12px;
    display:flex;align-items:center;justify-content:center;
  }
  .tag-autoext{box-shadow:0 0 0 3px var(--settle);}
  .tag-autoext-badge{
    position:absolute; top:8px; left:8px; width:20px;height:20px;border-radius:50%;
    background:var(--settle);color:#fff;font-size:12px;font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }

  .panel{background:var(--card);border-radius:16px;padding:22px 24px;box-shadow:var(--shadow);margin-bottom:20px;}
  .panel h2{
    font-family:'Fraunces',serif;font-size:19px;margin:0 0 16px;color:var(--ink);
    display:flex;align-items:center;gap:8px;
  }
  .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field.full{grid-column:1/-1;}
  .field label{font-size:12px;color:var(--text-mute);font-weight:600;}
  .field label .req{color:var(--occupied);}
  .field input, .field select{
    font-family:inherit;font-size:14px;padding:9px 11px;
    border:1px solid var(--paper-line);border-radius:8px;background:#FCFAF5;color:var(--text-dark);
  }
  .field input:focus, .field select:focus{outline:2px solid var(--ring);outline-offset:1px;border-color:var(--brass);}
  .nat-field{position:relative;}
  .nat-results{
    display:none;position:absolute;top:100%;left:0;right:0;margin-top:4px;
    background:var(--card);border:1px solid var(--paper-line);border-radius:8px;
    box-shadow:var(--shadow);max-height:220px;overflow-y:auto;z-index:60;
  }
  .nat-results.show{display:block;}
  .nat-results div{
    padding:8px 11px;font-size:13.5px;cursor:pointer;
    display:flex;justify-content:space-between;align-items:center;gap:10px;
  }
  .nat-results div:hover{background:var(--available-bg);}
  .nat-results .abbr{color:var(--text-mute);font-size:11px;font-weight:700;letter-spacing:.03em;flex-shrink:0;}
  .radio-row{display:flex;gap:16px;padding-top:2px;flex-wrap:wrap;}
  .radio-row label{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:500;color:var(--text-dark);}
  /* Amount boxes that appear only once a second payment method is ticked -- a bill split between
     cash and a transfer needs a figure per method, one method alone never does. */
  .pay-split{display:flex;flex-direction:column;gap:8px;margin-top:10px;padding:10px 12px;border:1px dashed var(--paper-line);border-radius:8px;}
  .pay-split-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .pay-split-row span{font-size:13px;font-weight:500;color:var(--text-dark);}
  .pay-split-row input{width:170px;padding:6px 8px;border:1px solid var(--paper-line);border-radius:6px;font-family:inherit;font-size:13px;}
  .pay-split-balance{font-size:12px;color:var(--text-mute);border-top:1px solid var(--paper-line);padding-top:8px;}
  .pay-warn{color:#B3261E;font-weight:600;}

  .total-box{
    background:var(--ink);color:var(--text-light);border-radius:10px;
    padding:14px 16px;display:flex;justify-content:space-between;align-items:center;margin:18px 0;
  }
  .total-box .label{font-size:12.5px;color:#C9C2B3;}
  .total-box .amount{font-family:'Fraunces',serif;font-size:22px;color:var(--brass);}

  .report-sticky-bar{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    background:var(--ink);color:var(--text-light);
    border-top:3px solid var(--brass);box-shadow:0 -6px 20px rgba(28,36,32,0.25);
    padding:12px 22px;display:flex;justify-content:center;gap:clamp(14px,4vw,36px);flex-wrap:wrap;
  }
  .report-sticky-bar .item{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;}
  .report-sticky-bar .item .label{font-size:11px;color:#C9C2B3;letter-spacing:.02em;}
  .report-sticky-bar .item .value{font-family:'Fraunces',serif;font-size:19px;color:var(--brass);white-space:nowrap;}
  .report-sticky-bar .item.grand .value{font-size:23px;}
  /* The grand total's label spells out the whole period, which is far too wide to keep four
     figures on one line on a phone -- so the bar carries a short label too and swaps to it
     below 640px, where the bar also becomes a fixed 4-column grid that can never wrap. */
  .bar-label-short{display:none;}

  .btn{
    font-family:inherit;font-size:13.5px;font-weight:600;
    padding:11px 16px;border-radius:9px;border:none;cursor:pointer;transition:opacity .15s ease;
  }
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .btn-primary{background:var(--brass);color:var(--ink);}
  .btn-primary:hover:not(:disabled){opacity:.88;}
  .btn-danger{background:var(--occupied);color:#fff;}
  .btn-danger:hover{opacity:.88;}
  .btn-settle{background:var(--settle);color:#fff;}
  .btn-settle:hover{opacity:.88;}
  .btn-ghost{background:transparent;border:1px solid var(--paper-line);color:var(--text-dark);}
  .btn-ghost:hover{border-color:var(--brass);}
  .btn-sm{padding:6px 11px;font-size:12px;border-radius:7px;}
  .btn-row{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap;}

  .modal-overlay{
    position:fixed;inset:0;background:rgba(20,24,20,0.55);
    display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;
  }
  .modal{
    background:var(--parchment);border-radius:18px;max-width:640px;width:100%;
    max-height:88vh;overflow-y:auto;padding:26px 28px;box-shadow:0 20px 60px rgba(0,0,0,0.35);
    border-top:5px solid var(--brass);
  }
  .modal-close{position:sticky;top:0;float:right;background:none;border:none;font-size:20px;cursor:pointer;color:var(--text-mute);}

  .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px;font-size:13.5px;margin-bottom:6px;}
  .info-grid div span{display:block;font-size:11px;color:var(--text-mute);}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--paper-line);}
  th{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-mute);}
  tr:hover td{background:#FCFAF2;}
  .badge{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;}
  .badge.void{background:var(--occupied-bg);color:var(--occupied);}
  .badge.active{background:var(--available-bg);color:var(--available);}
  .row-actions{display:flex;gap:6px;flex-wrap:wrap;}

  .stat-row{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:18px;}
  .stat{flex:1;min-width:150px;background:var(--card);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);}
  .stat .label{font-size:11.5px;color:var(--text-mute);font-weight:600;}
  .stat .value{font-family:'Fraunces',serif;font-size:26px;color:var(--ink);margin-top:4px;}

  .alert{border-radius:10px;padding:14px 16px;font-size:13.5px;margin-bottom:16px;display:flex;gap:10px;align-items:flex-start;}
  .alert.warn{background:var(--occupied-bg);color:#7A3226;border:1px solid var(--occupied);}
  .alert.ok{background:var(--available-bg);color:#2B5A41;border:1px solid var(--available);}
  .alert.info{background:var(--settle-bg);color:#2D3E56;border:1px solid var(--settle);}

  .empty{color:var(--text-mute);font-size:13.5px;padding:18px 0;text-align:center;}

  .table-scroll{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .table-scroll table{min-width:520px;}

  html{-webkit-text-size-adjust:100%;}
  body{overflow-x:hidden;}

  @media (max-width:640px){
    .field-grid{grid-template-columns:1fr;}
    .info-grid{grid-template-columns:1fr;}
    .console{padding:10px 12px;gap:8px;}
    main{padding:18px 12px 60px;}
    .panel{padding:16px 14px;border-radius:12px;}
    .modal{padding:20px 16px;border-radius:14px;max-height:92vh;}
    .stat-row{gap:10px;}
    .stat{padding:12px 14px;min-width:130px;}
    .stat .value{font-size:21px;}
    .room-grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px;}
    .tag{padding:16px 8px 12px;}
    .tag .room-no{font-size:23px;}
    .btn{padding:10px 14px;font-size:13px;}
    table{font-size:12px;}
    th,td{padding:7px 8px;}
    .report-sticky-bar{
      display:grid;grid-template-columns:repeat(4,1fr);
      gap:4px;padding:9px 8px;align-items:end;justify-items:center;
    }
    .report-sticky-bar .item.grand{grid-column:1/-1;}
    .report-sticky-bar .item .label{font-size:9.5px;text-align:center;line-height:1.2;}
    .report-sticky-bar .item .value{font-size:13px;}
    .report-sticky-bar .item.grand .value{font-size:15px;}
    .bar-label-full{display:none;}
    .bar-label-short{display:inline;}
  }
  @media (max-width:400px){
    .room-grid{grid-template-columns:repeat(auto-fill,minmax(94px,1fr));gap:8px;}
    .brand-text .title{font-size:15px;}
    .report-sticky-bar{gap:2px;padding:8px 4px;}
    .report-sticky-bar .item .label{font-size:9px;}
    .report-sticky-bar .item .value{font-size:11.5px;}
    .report-sticky-bar .item.grand .value{font-size:13px;}
  }
</style>
</head>

function natMatches(query){
  const q = (query||'').trim().toUpperCase();
  if(!q) return [];
  const starts = [];
  const contains = [];
  for(const item of NATIONALITY_CODES){
    if(item.c.toUpperCase().startsWith(q)) starts.push(item);
    else if(item.n.toUpperCase().includes(q)) contains.push(item);
  }
  return starts.concat(contains).slice(0,12);
}
// `target` says which object the picked nationality is written back to; it defaults to the open
// modal's form, which is every caller except the blacklist page (it has no modal behind it).
function wireNatAutocomplete(inputId, resultsId, prop, onPicked, target){
  const el = document.getElementById(inputId);
  const box = document.getElementById(resultsId);
  if(!el || !box) return;
  const store = ()=> target || modal.form;
  const renderResults = ()=>{
    const matches = natMatches(el.value);
    if(!matches.length){ box.classList.remove('show'); box.innerHTML=''; return; }
    box.innerHTML = matches.map(m=>`<div data-name="${m.n.replace(/"/g,'&quot;')}"><span>${m.n}</span><span class="abbr">${m.c}</span></div>`).join('');
    box.classList.add('show');
  };
  el.oninput = ()=>{ store()[prop] = el.value; renderResults(); };
  el.onfocus = ()=>{ renderResults(); };
  el.onblur = ()=>{ setTimeout(()=>{ box.classList.remove('show'); box.innerHTML=''; }, 150); };
  box.onmousedown = (e)=>{
    const row = e.target.closest('[data-name]');
    if(!row) return;
    e.preventDefault();
    el.value = row.dataset.name;
    store()[prop] = row.dataset.name;
    box.classList.remove('show');
    box.innerHTML = '';
    if(onPicked) onPicked();
  };
}

/* ---------------- Local time helpers (never use UTC) ---------------- */
function localDateStr(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function parseDate(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function addDays(dateStr, days){ const d=parseDate(dateStr); d.setDate(d.getDate()+days); return localDateStr(d); }
function daysBetween(startStr, endStr){ const a=parseDate(startStr), b=parseDate(endStr); return Math.round((b-a)/86400000); }
function todayStr(){ return localDateStr(new Date()); }
function nowTimeStr(){ const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function nowLiveLabel(){
  const d=new Date();
  const days=['ອາທິດ','ຈັນ','ອັງຄານ','ພຸດ','ພະຫັດ','ສຸກ','ເສົາ'];
  return `${fmtDate(localDateStr(d))} (${days[d.getDay()]}) · ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

// A stay typed in after it already ended: its check-out date is a day that has fully passed, so
// the guest is long gone and the room in front of staff is free. Recorded straight as "ອອກແລ້ວ"
// with the room left green -- today's date has nothing to do with a stay that happened last week.
// A check-out dated *today* is not this: the guest may still be in the room, so that one stays
// occupied and staff press Check-out when they actually leave.
function isPastStay(form){
  const ci = form.ciDate || todayStr();
  const co = form.coDate || addDays(ci, Math.max(1, parseInt(form.nights,10)||1));
  return co < todayStr();
}

// A booking is overdue once its expected checkout date has fully passed.
function isOverdueBooking(b){
  return !!b && !b.voided && addDays(b.checkInDate, b.nights) < todayStr();
}
// Recomputed live everywhere it's used (never cached on `modal`), so the room grid badges always
// reflect the current state.
function overdueRoomsList(){
  return state.rooms
    .filter(r=>r.status==='occupied' && isOverdueBooking(state.bookings[r.bookingId]))
    .map(r=>({room:r, b:state.bookings[r.bookingId]}));
}
// Silent background action: at/after 13:00, any room still overdue gets extended by one night as
// ຈ່າຍພາຍຫຼັງ automatically -- no staff click required. This can only fire once per day per booking
// -- extending moves the due date to exactly today, so isOverdueBooking goes false immediately and
// the next tick finds nothing to do for that room. The room grid badge (autoExtendedPending) is
// what tells staff this happened, so they can correct it via the edit-dates form if the guest
// actually already left.
function autoExtendOverdueRooms(){
  if(new Date().getHours() < 13) return;
  overdueRoomsList().forEach(({room,b})=>{
    b.autoExtendedPending = true; // cleared when staff opens the room -- a prompt to double-check it
    doAddNights(room.id, b.id, 1, [{method:'later', amount:b.pricePerNight}], true);
  });
}

function migrateState(s){
  // Backfilled here rather than assumed, so every pre-blacklist save (and every restored backup
  // taken before this feature existed) loads without the blacklist page throwing.
  if(!Array.isArray(s.blacklist)) s.blacklist = [];
  s.rooms.forEach(r=>{ if(!('bookingId' in r)) r.bookingId=null; });
  Object.values(s.bookings).forEach(b=>{
    if(b.voided===undefined) b.voided=false;
    // `voided` is now what puts a booking in the trash, so every stay that was cancelled under the
    // old "ຍົກເລີກ" wording is already sitting in there -- it just needs a deletion date to show.
    if(b.voided && !b.deletedAt) b.deletedAt = b.voidedAt || b.checkInDate || todayStr();
    if(b.deleteTracked===undefined) b.deleteTracked=false;
    if(b.checkInTime===undefined) b.checkInTime='';
    if(b.checkOutTime===undefined) b.checkOutTime='';
    if(b.paymentType==='now') b.paymentType='cash';
    if(b.guestName===undefined || b.guestName===null) b.guestName='';
    if(b.autoExtendedPending===undefined) b.autoExtendedPending=false;
    if(b.shortStay===undefined) b.shortStay=false;
    // Split payments arrived later than these bookings; b.paymentType is still written alongside
    // payParts, so anything reading the old single field keeps working on new data too.
    if(!Array.isArray(b.payParts)) b.payParts = [];
  });
  s.revenueLog.forEach(e=>{
    if(e.voided===undefined) e.voided=false;
    if(e.paymentType==='now') e.paymentType='cash';
    if(e.guestName===undefined || e.guestName===null) e.guestName='';
    if(e.exportedToSheet===undefined) e.exportedToSheet=false;
    if(e.bookingId===undefined || e.bookingId===null){
      const match = Object.values(s.bookings).find(b=>b.roomId===e.roomId && b.guestName===e.guestName);
      e.bookingId = match ? match.id : null;
    }
  });
  return s;
}

/* ---------------- Payment methods (one bill can be split across several) ---------------- */
// A guest can settle one stay with more than one method at once (part cash, part transfer), so a
// payment is a LIST of {method, amount} parts rather than a single type. Ticking exactly one box
// behaves the same as the old radio -- that part simply carries the whole bill and no amount has
// to be typed -- so the everyday case is unchanged.
const PAY_METHODS = [
  {v:'cash',   label:'ຈ່າຍສົດ'},
  {v:'bcel',   label:'ໂອນ BCEL'},
  {v:'ldb',    label:'ໂອນ LDB'},
  {v:'wechat', label:'WeChat'},
  {v:'later',  label:'ຈ່າຍພາຍຫຼັງ'}
];
// store = anything holding {payMethods:[...], payAmounts:{method:'text'}} (a modal form, usually).
// Returns {parts, error}: parts is what should actually be written to revenueLog, error is a
// ready-to-show Lao message when the typed figures don't add up.
function payParts(store, total, opts){
  const allowPartial = !!(opts && opts.allowPartial);
  const sel = (store.payMethods||[]).filter(m=>PAY_METHODS.some(x=>x.v===m));
  if(sel.length===0) return {parts:[], error:'ກະລຸນາເລືອກຮູບແບບການຊຳລະ'};
  if(sel.length===1) return {parts:[{method:sel[0], amount:total}], error:''};
  const amounts = store.payAmounts||{};
  const rows = sel.map(m=>({method:m, amount:Math.max(0, parseInt(amounts[m],10)||0)}));
  const typed = rows.reduce((s,r)=>s+r.amount,0);
  const blanks = rows.filter(r=>r.amount<=0);
  // Exactly one box left empty means "and the rest goes on this one" -- the way staff will use this
  // most often (200,000 cash, remainder transferred) without doing the subtraction themselves.
  let auto = '', autoAmount = 0;
  if(blanks.length===1 && typed<total){ autoAmount = total-typed; blanks[0].amount = autoAmount; auto = blanks[0].method; }
  const sum = rows.reduce((s,r)=>s+r.amount,0);
  if(sum>total) return {parts:[], error:`ຍອດທີ່ໃສ່ ${fmtMoney(sum)} ເກີນຍອດທີ່ຕ້ອງຈ່າຍ ${fmtMoney(total)}`};
  if(sum<total && !allowPartial) return {parts:[], error:`ຍອດຍັງບໍ່ຄົບ — ຍັງເຫຼືອ ${fmtMoney(total-sum)}`};
  const parts = rows.filter(r=>r.amount>0);
  if(!parts.length) return {parts:[], error:'ກະລຸນາໃສ່ຈຳນວນເງິນ'};
  return {parts, error:'', auto, autoAmount};
}
function paySignature(parts){ return (parts||[]).map(p=>p.method+':'+p.amount).join('|'); }
function partsLabel(parts){
  if(!parts || !parts.length) return '-';
  if(parts.length===1) return payLabel(parts[0].method);
  return parts.map(p=>`${payLabel(p.method)} ${fmtMoney(p.amount)}`).join(' + ');
}
// Bookings saved before split payments existed have no payParts -- fall back to the single type
// they do have, so old stays still print a payment on the bill and in the edit form.
function bookingPayParts(b){
  return (b && Array.isArray(b.payParts) && b.payParts.length) ? b.payParts : [{method:(b||{}).paymentType, amount:(b||{}).totalPrice||0}];
}
function bookingPayLabel(b){ return partsLabel(bookingPayParts(b)); }
function payStoreFromParts(parts){
  const store = {payMethods: parts.map(p=>p.method), payAmounts:{}};
  if(parts.length>1) parts.forEach(p=>{ store.payAmounts[p.method] = String(p.amount); });
  return store;
}

// The tick-boxes plus (only when more than one is ticked) an amount per method and a running
// balance. Shared by check-in, group check-in, ຢູ່ຕໍ່, ຊຳລະຄ້າງ and ແກ້ໄຂ -- `prefix` keeps the
// element ids apart when two pickers sit in the same modal.
function renderPayPicker(prefix, store, total, opts){
  const o = opts||{};
  const sel = store.payMethods||[];
  const methods = o.methods ? PAY_METHODS.filter(m=>o.methods.includes(m.v)) : PAY_METHODS;
  const boxes = methods.map(m=>{
    const label = (m.v==='later' && o.longLater) ? 'ຈ່າຍພາຍຫຼັງ (ບໍລິສັດ/ອົງກອນ)' : m.label;
    return `<label><input type="checkbox" id="${prefix}-pay-${m.v}" ${sel.includes(m.v)?'checked':''}> ${label}</label>`;
  }).join('');
  const split = sel.length>1 ? `
          <div class="pay-split">
            ${sel.map(v=>`<div class="pay-split-row"><span>${payLabel(v)}</span><input type="number" min="0" id="${prefix}-payamt-${v}" value="${(store.payAmounts||{})[v]||''}" placeholder="ວ່າງໄວ້ = ສ່ວນທີ່ເຫຼືອ"></div>`).join('')}
            <div class="pay-split-balance" id="${prefix}-pay-balance">${payBalanceHtml(store, total, o)}</div>
          </div>` : '';
  return `<div class="field full" id="${prefix}-pay-block">
          <label>${o.label||'ຮູບແບບການຊຳລະເງິນ'} <span style="font-weight:400;color:var(--text-mute);">(ຕິກໄດ້ຫຼາຍກວ່າ 1 ຖ້າຈ່າຍປະສົມ)</span></label>
          <div class="radio-row">${boxes}</div>${split}
        </div>`;
}
function payBalanceHtml(store, total, opts){
  const r = payParts(store, total, opts);
  if(r.error) return `<span class="pay-warn">⚠️ ${r.error}</span>`;
  const sum = r.parts.reduce((s,p)=>s+p.amount,0);
  const left = total - sum;
  // Spelling out which box absorbed the remainder, so leaving one empty never looks like the figure
  // was simply ignored.
  const filled = r.auto
    ? ` · <b>${payLabel(r.auto)}</b> ຮັບສ່ວນທີ່ເຫຼືອ <b>${fmtMoney(r.autoAmount)}</b>`
    : ` · ໃສ່ແລ້ວ <b>${fmtMoney(sum)}</b>`;
  return `ຍອດທີ່ຕ້ອງຈ່າຍ <b>${fmtMoney(total)}</b>${filled}${left>0?` · ຍັງເຫຼືອ <b>${fmtMoney(left)}</b>`:''}`;
}
// `total` may be a function: the bill still moves while the modal is open (nights, price, extra
// nights), and the balance line has to follow it without a full re-render.
function wirePayPicker(prefix, store, total, opts, onToggle){
  const totalNow = ()=> (typeof total==='function' ? total() : total);
  PAY_METHODS.forEach(m=>{
    const cb = document.getElementById(`${prefix}-pay-${m.v}`);
    if(cb) cb.onchange = ()=>{
      const on = new Set(store.payMethods||[]);
      if(cb.checked){ on.add(m.v); }
      else { on.delete(m.v); if(store.payAmounts) delete store.payAmounts[m.v]; }
      store.payMethods = PAY_METHODS.filter(x=>on.has(x.v)).map(x=>x.v);
      // Repaint just this block. The amount boxes do appear and disappear, but nothing outside the
      // picker moves, and re-rendering the whole page for it threw away how far the modal was
      // scrolled -- on a phone the form jumped back to its top after every single tap. Restoring
      // the scroll position afterwards was not enough on real mobile browsers; the reliable answer
      // is not to rebuild the page at all. `opts` must match what renderPayPicker was called with,
      // which is why every call site now passes the same object.
      const block = document.getElementById(`${prefix}-pay-block`);
      if(block){
        block.outerHTML = renderPayPicker(prefix, store, totalNow(), opts);
        // the ຢວນ amount field lives outside the block but follows the WeChat tick-box
        const wechatWrap = document.getElementById(`${prefix}-wechat-wrap`);
        if(wechatWrap) wechatWrap.style.display = (store.payMethods||[]).includes('wechat') ? 'flex' : 'none';
        wirePayPicker(prefix, store, total, opts, onToggle); // rewire the freshly drawn boxes
      } else if(onToggle){
        onToggle();
      }
    };
    const amt = document.getElementById(`${prefix}-payamt-${m.v}`);
    if(amt) amt.oninput = ()=>{
      if(!store.payAmounts) store.payAmounts = {};
      store.payAmounts[m.v] = amt.value;
      const el = document.getElementById(`${prefix}-pay-balance`);
      if(el) el.innerHTML = payBalanceHtml(store, totalNow(), opts);
    };
  });
}

/* ---------------- Blacklist ---------------- */
// Blacklist rows are free text typed by staff (a reason can contain anything), so unlike the
// booking fields around them they get escaped before going anywhere near innerHTML.
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function normName(s){ return String(s==null?'':s).trim().toLowerCase().replace(/\s+/g,' '); }
// Document numbers get written with spaces, dashes and mixed case depending on who typed them,
// so compare only the alphanumerics -- "AB 123-456" and "ab123456" are the same passport.
function normDoc(s){ return String(s==null?'':s).toUpperCase().replace(/[^A-Z0-9]/g,''); }
function blacklistMatches(name, docNumber){
  const n = normName(name), d = normDoc(docNumber);
  if(!n && !d) return [];
  return (state.blacklist||[]).filter(e =>
    (d && normDoc(e.docNumber) === d) || (n && normName(e.name) === n)
  );
}
function blacklistWarnHtml(name, docNumber){
  const hits = blacklistMatches(name, docNumber);
  if(!hits.length) return '';
  return `<div class="alert warn" style="margin-top:10px;">
    <span>🚫</span>
    <div><b>ລູກຄ້ານີ້ຢູ່ໃນ Blacklist</b>${hits.map(h=>`
      <div style="margin-top:4px;">${esc(h.name)||'-'}${h.docNumber?' · '+esc(h.docNumber):''}${h.reason?' — '+esc(h.reason):''}</div>`).join('')}
      <div style="margin-top:6px;font-size:12px;">ຍັງເຊັກອິນຕໍ່ໄດ້ ແຕ່ຕ້ອງກົດຢືນຢັນອີກຄັ້ງ</div></div>
  </div>`;
}
function doAddBlacklist(entry){

// Warns but never blocks: a blacklisted guest can still be checked in, it just takes a second,
// deliberate confirmation so it can't happen by reflex.
function confirmBlacklistCheckin(form){
  const hits = blacklistMatches(form.guestName, form.docNumber);

/* ---------------- Derived helpers ---------------- */
// Every push site (pushNightlyRevenue, doSettlePayment) always sets its own paymentType, so trust
// that directly -- falling back to the booking's paymentType (as this used to) meant every entry
// silently displayed whatever the booking's CURRENT paymentType is, even after it changed, which is
// wrong now that a booking can have nights logged under different payment methods over time.
function entryPaymentType(e){
  return e.paymentType!==undefined ? e.paymentType : (state.bookings[e.bookingId]||{}).paymentType;
}
function bookingUnpaid(bookingId){
  const entries = state.revenueLog.filter(e=>e.bookingId===bookingId && !e.voided);
  const owed = entries.filter(e=>(e.kind==='checkin'||e.kind==='addnights') && entryPaymentType(e)==='later').reduce((s,e)=>s+e.amount,0);
  const settled = entries.filter(e=>e.kind==='settle').reduce((s,e)=>s+e.amount,0);
  return Math.max(0, owed - settled);
}
// The site always sends its full list of active (non-voided) received entries; the sheet matches
// each row to one of these by id, leaving already-present rows untouched (so hand-edits made
// directly in the sheet survive) and only adding new ones or deleting ones that dropped off this
// list (cancelled bookings). Deliberately ignores the selected report period: this list is everything.
function entriesToSync(){
  return state.revenueLog
    .filter(e=> !e.voided && (e.kind==='settle' || entryPaymentType(e)!=='later'))
    .sort((a,b)=> (a.date+' '+(a.time||'')).localeCompare(b.date+' '+(b.time||'')));
}

/* ---------------- Actions (all append-only; nothing is ever removed) ---------------- */
// Splits a multi-night charge into one revenueLog entry per night, dated the night it actually
// covers -- so the daily figures on ການເງິນ show this room's revenue on every date of the stay, not
// lumped onto whichever day it happened to be logged.
function payQueue(parts){ return parts.map(p=>({method:p.method, left:p.amount})); }
// Takes the next slice of `amount` out of the queue, oldest part first. Whatever the queue cannot
// cover comes back as 'later' -- that is what makes a partial payment simply reduce what is owed.
function allocateFromQueue(queue, amount){
  const alloc = [];
  let left = amount;
  while(left>0){
    const part = queue.find(p=>p.left>0);
    if(!part){ alloc.push({method:'later', amount:left}); break; }
    const take = Math.min(left, part.left);
    alloc.push({method:part.method, amount:take});
    part.left -= take; left -= take;
  }
  return alloc;
}
// Rewrites one nightly row into its allocation: the row itself becomes the first slice (keeping its
// id, so a row already on the Excel sheet is not duplicated) and further slices are appended as new
// rows on the same night.
function applyAllocationToEntry(e, alloc){
  if(!alloc.length) return;
  e.amount = alloc[0].amount;
  e.paymentType = alloc[0].method;
  alloc.slice(1).forEach(a=>{
    state.revenueLog.push({id:uid(), bookingId:e.bookingId, date:e.date, time:e.time, roomId:e.roomId,
      guestName:e.guestName, amount:a.amount, paymentType:a.method, kind:e.kind, voided:false, exportedToSheet:false});
  });
}
// One revenueLog row per night per method: the per-night dating the reports depend on is kept, and
// a split bill just means one night can carry two rows (e.g. 150,000 cash + 100,000 BCEL). Returns
// what this stay actually drew from the queue, so a booking in a group check-in can store its own
// share of one payment that covered several rooms.
function pushNightlyRevenueParts(queue, bookingId, roomId, guestName, startDate, nights, pricePerNight, time, kind){
  const used = {};
  for(let i=0;i<nights;i++){
    const date = addDays(startDate,i);
    // A free night still gets a row, so the night is visible on the sheet and in ການເງິນ.
    const alloc = pricePerNight>0 ? allocateFromQueue(queue, pricePerNight)
                                  : [{method:(queue.find(p=>p.left>0)||{}).method||'later', amount:0}];
    alloc.forEach(a=>{
      state.revenueLog.push({id:uid(), bookingId, date, time, roomId, guestName, amount:a.amount,
        paymentType:a.method, kind, voided:false});
      used[a.method] = (used[a.method]||0) + a.amount;
    });
  }
  return PAY_METHODS.filter(m=>used[m.v]>0).map(m=>({method:m.v, amount:used[m.v]}));
}
function pushNightlyRevenue(bookingId, roomId, guestName, startDate, nights, pricePerNight, time, paymentType, kind){
  return pushNightlyRevenueParts(payQueue([{method:paymentType, amount:nights*pricePerNight}]),
    bookingId, roomId, guestName, startDate, nights, pricePerNight, time, kind);
}
// Re-applies a payment split across a booking's live nightly rows -- used when staff correct the
// payment on ແກ້ໄຂ. Rows keep their dates, so the daily figures never move; only who paid changes.
function restampBookingPayments(bookingId, parts){
  const entries = state.revenueLog
    .filter(e=>e.bookingId===bookingId && !e.voided && (e.kind==='checkin'||e.kind==='addnights'))
    .sort((a,b)=> (a.date+' '+(a.time||'')).localeCompare(b.date+' '+(b.time||'')));
  const queue = payQueue(parts);
  entries.forEach(e=>{ applyAllocationToEntry(e, allocateFromQueue(queue, e.amount)); });
}
// A price correction has to keep each night's rows adding up to the new price. With a split payment
// one night can be several rows, so the new price is shared out in the same proportions instead of
// being stamped onto every row (which would multiply that night's takings by the number of methods).
function repriceNightlyEntries(bookingId, newPrice){
  const byDate = {};
  state.revenueLog.forEach(e=>{
    if(e.bookingId===bookingId && !e.voided && (e.kind==='checkin'||e.kind==='addnights')){
      (byDate[e.date] = byDate[e.date] || []).push(e);
    }
  });
  Object.keys(byDate).forEach(d=>{
    const rows = byDate[d];
    if(rows.length===1){ rows[0].amount = newPrice; return; }
    const old = rows.reduce((s,e)=>s+e.amount,0);
    let left = newPrice;
    rows.forEach((e,i)=>{
      const share = (i===rows.length-1) ? left
        : (old>0 ? Math.round(newPrice*e.amount/old) : Math.round(newPrice/rows.length));
      e.amount = Math.max(0, Math.min(share, left));
      left -= e.amount;
    });
  });
}

function doGroupCheckin(roomIds, form){
  const ciDate = form.ciDate || todayStr();
  const time = form.ciTime || nowTimeStr();
  const groupId = uid();
  const nights = Math.max(1, parseInt(form.nights,10)||1);
  const coDate = addDays(ciDate, nights);
  const past = coDate < todayStr();
  const priceFor = roomId=>{
    const room = state.rooms.find(r=>r.id===roomId);
    return Math.max(0, parseInt((form.prices&&form.prices[roomId])||room.price,10));
  };
  // The payment is taken against the whole group's bill, then drained room by room -- one guest
  // paying 1,000,000 cash + 500,000 BCEL for four rooms should not have to split it per room.
  const grandTotal = roomIds.reduce((s,id)=>s+nights*priceFor(id),0);
  const pay = payParts(form, grandTotal);
  if(pay.error){ alert(pay.error); return false; }
  const queue = payQueue(pay.parts);
  const usesWechat = pay.parts.some(p=>p.method==='wechat');
  roomIds.forEach(roomId=>{
    const room = state.rooms.find(r=>r.id===roomId);
    const price = priceFor(roomId);
    const total = nights * price;
    const bookingId = uid();
    state.bookings[bookingId] = {
      id:bookingId, roomId, staffName:form.receiverName||'', guestName:form.guestName||'',
      gender:form.gender||'', docNumber:form.docNumber||'', nationality:form.nationality||'', phone:form.phone||'',
      nights, pricePerNight:price, totalPrice:total, paymentType:'later', payParts:[],
      wechatAmount: usesWechat ? (form.wechatAmount||'') : '',
      checkInDate: ciDate, checkInTime: time,
      checkOutDate: past ? coDate : null, checkOutTime: past ? (form.coTime||'12:00') : '',
      voided:false, groupId, autoExtendedPending:false
    };
    room.status = past ? 'available' : 'occupied';
    room.bookingId = past ? null : bookingId;
    const used = pushNightlyRevenueParts(queue, bookingId, roomId, form.guestName||'', ciDate, nights, price, time, 'checkin');
    state.bookings[bookingId].payParts = used;
    state.bookings[bookingId].paymentType = used.length===1 ? used[0].method : 'split';
  });
  saveState();
  return true;
}

function doCheckin(roomId, form){
  const room = state.rooms.find(r=>r.id===roomId);
  const nights = Math.max(1, parseInt(form.nights,10)||1);
  const price = Math.max(0, parseInt(form.price,10) || room.price);
  const total = nights * price;
  const pay = payParts(form, total);
  if(pay.error){ alert(pay.error); return; }
  const bookingId = uid();
  const ciDate = form.ciDate || todayStr();
  const time = form.ciTime || nowTimeStr();
  const coDate = addDays(ciDate, nights);
  const past = coDate < todayStr();
  state.bookings[bookingId] = {
    id:bookingId, roomId, staffName:form.receiverName||'', guestName:form.guestName||'',
    gender:form.gender||'', docNumber:form.docNumber||'', nationality:form.nationality||'', phone:form.phone||'',
    nights, pricePerNight:price, totalPrice:total,
    paymentType: pay.parts.length===1 ? pay.parts[0].method : 'split', payParts: pay.parts,
    wechatAmount: pay.parts.some(p=>p.method==='wechat') ? (form.wechatAmount||'') : '',
    checkInDate: ciDate, checkInTime: time,
    checkOutDate: past ? coDate : null, checkOutTime: past ? (form.coTime||'12:00') : '',
    voided:false, autoExtendedPending:false
  };
  room.status = past ? 'available' : 'occupied';
  room.bookingId = past ? null : bookingId;
  pushNightlyRevenueParts(payQueue(pay.parts), bookingId, roomId, form.guestName||'', ciDate, nights, price, time, 'checkin');
  saveState();
  modal=null; render();
}

function doAddNights(roomId, bookingId, extraNights, parts, keepModal){
  const b = state.bookings[bookingId];
  const n = Math.max(1, parseInt(extraNights,10)||1);
  const currentDue = addDays(b.checkInDate, b.nights); // capture before nights is mutated below
  b.nights += n;
  b.totalPrice += n * b.pricePerNight;
  pushNightlyRevenueParts(payQueue(parts), bookingId, roomId, b.guestName, currentDue, n, b.pricePerNight, nowTimeStr(), 'addnights');
  saveState();
  if(!keepModal) modal=null;
  render();
}

// Flips each outstanding 'later' entry to the real method actually paid, oldest night first, instead
// of logging one lump sum on whatever day the settlement happens -- so a guest who stayed 3 nights
// and settles today still shows as 250,000 on each of those 3 days in the report, not 750,000 today.
function doSettlePayment(roomId, bookingId, parts){
  if(bookingUnpaid(bookingId)<=0) return;
  const owedEntries = state.revenueLog
    .filter(e=>e.bookingId===bookingId && !e.voided && (e.kind==='checkin'||e.kind==='addnights') && entryPaymentType(e)==='later')
    .sort((a,b)=> (a.date+' '+(a.time||'')).localeCompare(b.date+' '+(b.time||'')));
  // The money can arrive as a mix (part cash, part transfer) and can be less than the full debt, so
  // each night is filled from the payment in turn -- a night the payment only half covers is split
  // into a paid row and a row that stays 'later', which keeps ຍອດຄ້າງ exactly right.
  const queue = payQueue(parts);
  owedEntries.forEach(e=>{
    if(!queue.some(p=>p.left>0)) return;
    applyAllocationToEntry(e, allocateFromQueue(queue, e.amount));
  });
  saveState();
  render();
}

// The check-out stamp is whatever staff typed on the form, not the clock: a stay recorded a day or
// three late (guest already gone, or the whole stay entered after the fact with a backdated
// check-in) has to carry its real departure date, or it never turns up in a ວັນທີເຊັກເອົາທ໌ search
// and reads as "ອອກແລ້ວ" on the wrong day. Falls back to now when no date is passed.
function doCheckout(roomId, bookingId, keepModal, coDate, coTime){
  const b = state.bookings[bookingId];
  const room = state.rooms.find(r=>r.id===roomId);
  const date = coDate || todayStr();
  if(date < b.checkInDate){ alert('ວັນທີ Check-out ຕ້ອງບໍ່ກ່ອນວັນທີເຊັກອິນ ('+fmtDate(b.checkInDate)+')'); return; }
  b.checkOutDate = date;
  b.checkOutTime = coTime || nowTimeStr();
  room.status = 'cleaning';
  saveState();
  if(!keepModal) modal=null;
  render();
}

function doUndoCheckout(roomId){
  const room = state.rooms.find(r=>r.id===roomId);
  const b = state.bookings[room.bookingId];
  if(!b) return;
  b.checkOutDate = null;
  b.checkOutTime = '';
  room.status = 'occupied';
  saveState();
  modal=null; render();
}

function doConfirmCleaning(roomId){
  const room = state.rooms.find(r=>r.id===roomId);
  room.status = 'available';
  room.bookingId = null;
  saveState();
  modal=null; render();
}

function doSaveEdit(bookingId, fields){
  const b = state.bookings[bookingId];
  // A nights/date correction (from the edit-booking form) must recompute the total and log the
  // difference, because bookingUnpaid() reads only revenueLog, never b.totalPrice -- silently
  // changing nights without this would leave "unpaid" showing the old, wrong figure forever.
  const newPrice = fields.pricePerNight!==undefined ? Math.max(0, parseInt(fields.pricePerNight,10)||0) : b.pricePerNight;
  const priceChanged = newPrice !== b.pricePerNight;
  const billNights = fields.nights!==undefined ? fields.nights : b.nights;
  const nightsChanged = fields.nights!==undefined && fields.nights!==b.nights;
  // fields.shortStay marks a guest who checked in and out the same calendar day -- still billed
  // for 1 night (billNights, above, is never let to 0), but the room must free up for cleaning
  // *today* rather than waiting for "tomorrow" the way a normal date edit would compute it.
  if(nightsChanged || fields.shortStay){
    fields.autoExtendedPending = false; // either direction means this booking's dates are now settled
    const anchorCheckIn = fields.checkInDate || b.checkInDate;
    if(billNights > b.nights){
      pushNightlyRevenue(bookingId, b.roomId, b.guestName, addDays(anchorCheckIn, b.nights), billNights-b.nights,
        newPrice, nowTimeStr(), 'later', 'addnights');
    } else {
      // Fewer nights than logged (or a same-day short stay), most often correcting a wrong 13:00
      // auto-extend after the guest had actually already left. A shorter stay whose room is still
      // marked 'occupied' would just read as overdue again and get auto-extended right back on the
      // next tick -- so this has to be a real checkout, not just a number correction, for "the auto
      // system won't touch it again" to actually hold. Only does this if the room is still this
      // exact booking's live occupant, so it can never touch a room already re-let to someone else.
      // The voiding cutoff stays nights-based (the day after the last *billed* night); the physical
      // checkout stamp uses the literal date the user picked, which for a short stay is today, not
      // "tomorrow" -- that's what actually frees the room up for same-day cleaning and re-letting.
      const voidCutoff = addDays(anchorCheckIn, billNights);
      const actualCheckOut = fields.checkOutDateExp || voidCutoff;
      const room = state.rooms.find(r=>r.id===b.roomId);
      if(room && room.bookingId===bookingId && room.status==='occupied'){
        fields.checkOutDate = actualCheckOut;
        fields.checkOutTime = '';
        room.status = 'cleaning';
      }
      // Void the STILL-UNPAID entries for the nights being cut (dated on/after the new checkout) --
      // those nights never happened, most often a phantom 'later' entry the 13:00 auto-extend added.
      // Never touches entries that were actually paid, since that could erase real money collected;
      // staff void/adjust those by hand if this correction really does mean less was owed.
      state.revenueLog.forEach(e=>{
        if(e.bookingId===bookingId && !e.voided && (e.kind==='checkin'||e.kind==='addnights') &&
           entryPaymentType(e)==='later' && e.date>=voidCutoff){
          e.voided = true;
        }
      });
    }
  }
  // A price-per-night correction re-stamps every still-live nightly row for this booking, same
  // idea as the payment-type flip below -- b.totalPrice is never the source of truth on its own.
  if(priceChanged){
    repriceNightlyEntries(bookingId, newPrice);
  }
  fields.pricePerNight = newPrice;
  fields.totalPrice = billNights * newPrice;
  // Only re-stamp when the payment picker was actually changed: an edit to the guest's name must
  // never rewrite money rows, and a nights change alone still logs its extra nights as 'later'.
  // The real check-out stamp is corrected on its own, separately from the expected-checkout field
  // that drives the nights count -- fixing the day a guest actually left must not re-bill the stay.
  // Applied after Object.assign so it wins over anything the nights branch above wrote.
  const realCO = fields.checkOutDateReal, realCOTime = fields.checkOutTimeReal;
  delete fields.checkOutDateReal; delete fields.checkOutTimeReal;
  const newParts = Array.isArray(fields.payParts) && fields.payParts.length ? fields.payParts : null;
  const payChanged = !!newParts && paySignature(newParts) !== (fields.origPaySig||'');
  delete fields.origPaySig; delete fields.payMethods; delete fields.payAmounts;
  Object.assign(b, fields);
  if(realCO && b.checkOutDate){ b.checkOutDate = realCO; b.checkOutTime = realCOTime||''; }
  if(payChanged) restampBookingPayments(bookingId, newParts);
  saveState();
  modal=null; render();
}

function openEditBookingModal(bookingId){
  const b = state.bookings[bookingId];
  const parts = bookingPayParts(b);
  const payStore = payStoreFromParts(parts);
  // origPaySig rides along in the form so doSaveEdit can tell "staff changed the payment" apart
  // from "staff changed something else and the payment simply came back unchanged".
  modal = {type:'editBooking', bookingId:b.id, form:{guestName:b.guestName, gender:b.gender,
    docNumber:b.docNumber, nationality:b.nationality, phone:b.phone, wechatAmount:b.wechatAmount||'',
    payMethods:payStore.payMethods, payAmounts:payStore.payAmounts, origPaySig:paySignature(parts),
    pricePerNight:b.pricePerNight, checkInDate:b.checkInDate, checkOutDateExp:addDays(b.checkInDate,b.nights),
    checkInTime:b.checkInTime||'', checkOutDateReal:b.checkOutDate||'', checkOutTimeReal:b.checkOutTime||''}};
  render();
}

/* ---------------- Trash (delete / restore / purge) ---------------- */
// Deleting moves a stay to the trash rather than erasing it: it drops out of the search page and
// its money drops out of ການເງິນ (and off the Excel sheet on the next sync, since entriesToSync
// only sends live entries), but everything is still there to be restored until the trash is emptied.
function trashedBookings(){
  return Object.values(state.bookings).filter(b=>b.voided)
    .sort((a,b)=> (b.deletedAt||'').localeCompare(a.deletedAt||'') || (b.deletedTime||'').localeCompare(a.deletedTime||''));
}
function doDeleteBooking(bookingId){
  const b = state.bookings[bookingId];
  if(!b || b.voided) return;
  b.voided = true;
  b.voidedAt = todayStr();
  b.deletedAt = todayStr();
  b.deletedTime = nowTimeStr();
  // Only the entries that were still live get marked, so a later restore brings back exactly the
  // money this delete took away -- and never resurrects nights that an earlier date correction
  // had already voided on purpose.
  b.deleteTracked = true;
  state.revenueLog.forEach(e=>{
    if(e.bookingId===bookingId && !e.voided){ e.voided = true; e.deletedWithBooking = true; }
  });
  const room = state.rooms.find(r=>r.id===b.roomId);
  if(room && room.bookingId===bookingId){
    b.deletedRoomStatus = room.status; // so restoring can hand the room back exactly as it was
    room.status = 'available';
    room.bookingId = null;
  }
  saveState();
  modal=null; render();
}
// Returns a note when the room could not be handed back, so the caller can say so out loud rather
// than silently restoring a stay whose room now belongs to somebody else.
function doRestoreBooking(bookingId){
  const b = state.bookings[bookingId];
  if(!b || !b.voided) return '';
  b.voided = false;
  delete b.voidedAt;
  delete b.deletedAt;
  delete b.deletedTime;
  state.revenueLog.forEach(e=>{
    // Bookings deleted before this feature existed had every entry voided in one sweep, so undoing
    // that same sweep is the exact inverse for them.
    if(e.bookingId===bookingId && (!b.deleteTracked || e.deletedWithBooking)){
      e.voided = false;
      delete e.deletedWithBooking;
    }
  });
  b.deleteTracked = false;
  let note = '';
  const room = state.rooms.find(r=>r.id===b.roomId);
  const wantsRoom = b.deletedRoomStatus || (b.checkOutDate ? '' : 'occupied');
  if(wantsRoom){
    if(room && room.status==='available' && !room.bookingId){
      room.status = wantsRoom;
      room.bookingId = bookingId;
    } else if(room){
      note = `ຫ້ອງ ${b.roomId} ຖືກໃຊ້ໂດຍແຂກອື່ນແລ້ວ — ກູ້ຄືນສະເພາະຂໍ້ມູນ ແລະ ຍອດເງິນ, ຜັງຫ້ອງພັກບໍ່ຖືກແຕະຕ້ອງ`;
    }
  }
  delete b.deletedRoomStatus;
  saveState();
  modal=null; render();
  return note;
}
// The one place in this app that really removes data. Everything else only ever appends or flags.
function doPurgeBooking(bookingId){
  const b = state.bookings[bookingId];
  if(!b || !b.voided) return;
  state.revenueLog = state.revenueLog.filter(e=>e.bookingId!==bookingId);
  state.rooms.forEach(r=>{ if(r.bookingId===bookingId){ r.bookingId = null; if(r.status!=='available') r.status='available'; } });
  delete state.bookings[bookingId];
  saveState();
  render();
}
// Starting the hotel's records over from nothing. Lives on the trash page rather than the console
// bar so it can't be brushed on a phone, takes a typed word rather than an OK button, and drops a
// backup file first -- this reaches every device through Firestore and there is no undo.
function doResetEverything(){
  exportBackup();
  state = defaultState();
  saveState();
  modal = null; view = 'grid';
  render();
}

function doEmptyTrash(){
  trashedBookings().forEach(b=>{
    state.revenueLog = state.revenueLog.filter(e=>e.bookingId!==b.id);
    state.rooms.forEach(r=>{ if(r.bookingId===b.id){ r.bookingId = null; if(r.status!=='available') r.status='available'; } });
    delete state.bookings[b.id];
  });
  saveState();
  render();
}

/* ---------------- Rendering ---------------- */
// What was on screen at the end of the last render. Scroll position is only worth restoring when
// the same thing is still showing -- opening a modal or switching tabs should start at the top.
let lastRender = {view:null, modalType:null};

function render(){
  const active = document.activeElement;
  let activeId = null, selStart=null, selEnd=null;
  if(active && active.id && (active.tagName==='INPUT' || active.tagName==='SELECT' || active.tagName==='TEXTAREA')){
    activeId = active.id;
    if(typeof active.selectionStart === 'number'){ selStart = active.selectionStart; selEnd = active.selectionEnd; }
  }
  // The whole page is rebuilt below, which throws away how far down the modal was scrolled (.modal
  // is the scrolling box, not the page). On a phone that reads as the form jumping back to the top
  // every single time a payment tick-box is touched -- toggling one re-renders, because the amount
  // boxes appear and disappear -- leaving staff to scroll back down after every tap.
  const prevModal = document.querySelector('.modal');
  const modalScroll = prevModal ? prevModal.scrollTop : 0;
  const pageScroll = window.scrollY || window.pageYOffset || 0;
  const sameView = lastRender.view === view;
  const sameModal = lastRender.modalType === (modal ? modal.type : null);

  const app = document.getElementById('app');
  app.innerHTML = `
    ${renderConsole()}
    <main>${renderView()}</main>
    ${modal ? renderModal() : ''}
  `;
  attachHandlers();
  lastRender = {view, modalType: modal ? modal.type : null};

  if(activeId){
    const el = document.getElementById(activeId);
    if(el){
      // preventScroll: focusing the rebuilt element would otherwise yank it into view on mobile,
      // fighting the position being put back just below.
      try{ el.focus({preventScroll:true}); }catch(e){ el.focus(); }
      if(selStart!==null && el.setSelectionRange){
        try{ el.setSelectionRange(selStart, selEnd); }catch(e){}
      }
    }
  }

  // Applied twice: mobile browsers finish laying the rebuilt modal out after this tick, and a
  // scrollTop set against a not-yet-tall-enough box is silently clamped back to the top.
  const putBack = ()=>{
    if(sameView && pageScroll) window.scrollTo(0, pageScroll);
    if(sameModal && modalScroll){
      const nextModal = document.querySelector('.modal');
      if(nextModal) nextModal.scrollTop = modalScroll;
    }
  };
  putBack();
  requestAnimationFrame(putBack);
}

function searchResults(){
  return Object.values(state.bookings).filter(b=>{
    if(b.voided) return false; // deleted stays live in the trash only -- never in the search results
    const nameOk = !searchQuery.name || (b.guestName||'').toLowerCase().includes(searchQuery.name.toLowerCase());
    const roomOk = !searchQuery.room || b.roomId===searchQuery.room;
    // The date range filters on whichever single date field the dropdown picked (check-in or
    // check-out) -- picking "check-out" and a range shows exactly the rooms that checked out in
    // that window, matching bookings that haven't actually checked out (checkOutDate still null)
    // fails on purpose. "ລະຫວ່າງ" is the one exception: an overlap search (who was staying at any
    // point in the window), falling back to the expected checkout for a still-ongoing stay so it
    // still shows up when the window covers today.
    let rangeOk = true;
    if(searchQuery.rangeFrom || searchQuery.rangeTo){
      if(searchQuery.dateType==='between'){
        const stayEnd = b.checkOutDate || addDays(b.checkInDate, b.nights);
        rangeOk = (!searchQuery.rangeTo || b.checkInDate<=searchQuery.rangeTo) &&
                  (!searchQuery.rangeFrom || stayEnd>=searchQuery.rangeFrom);
      } else {
        const target = searchQuery.dateType==='checkout' ? b.checkOutDate : b.checkInDate;
        rangeOk = !!target && (!searchQuery.rangeFrom || target>=searchQuery.rangeFrom) &&
                  (!searchQuery.rangeTo || target<=searchQuery.rangeTo);
      }
    }
    return nameOk && roomOk && rangeOk;
  }).sort((a,b)=> b.checkInDate.localeCompare(a.checkInDate) || (b.checkInTime||'').localeCompare(a.checkInTime||'') || Number(a.roomId)-Number(b.roomId));
}

// A stay belongs to whichever month it checked in during -- the whole booking is one row (its
// money total spans however many nights it ran), so it can't also be split across any month it
// might have bled into via a later checkout.
function bookingsForReportMonth(monthStr){
  return Object.values(state.bookings)
    .filter(b=>!b.voided && b.checkInDate && b.checkInDate.slice(0,7)===monthStr)
    .sort((a,b)=> b.checkInDate.localeCompare(a.checkInDate) || (b.checkInTime||'').localeCompare(a.checkInTime||'') || Number(a.roomId)-Number(b.roomId));
}
// A "ຕັ້ງແຕ່-ຫາ" search is an overlap search across ALL months (not just the one currently
// selected) -- who was staying at any point in this window. An ongoing stay (no real checkOutDate
// yet) falls back to its expected checkout so it still counts when the window covers today.
function bookingsForReportRange(fromDate, toDate){
  return Object.values(state.bookings)
    .filter(b=>{
      if(b.voided || !b.checkInDate) return false;
      const stayEnd = b.checkOutDate || addDays(b.checkInDate, b.nights);
      return (!toDate || b.checkInDate<=toDate) && (!fromDate || stayEnd>=fromDate);
    })
    .sort((a,b)=> b.checkInDate.localeCompare(a.checkInDate) || (b.checkInTime||'').localeCompare(a.checkInTime||'') || Number(a.roomId)-Number(b.roomId));
}
// The ການເງິນ page picks its dates exactly the way ຄົ້ນຫາ / ຈັດການ does, and each mode means the
// same thing on both pages: 'checkin'/'checkout' filter on that one date, 'between' is the overlap
// search (who was staying at any point in the window).
function bookingsForReportDate(type, fromDate, toDate){
  if(type==='between') return bookingsForReportRange(fromDate, toDate);
  return Object.values(state.bookings)
    .filter(b=>{
      if(b.voided || !b.checkInDate) return false;
      const target = type==='checkout' ? b.checkOutDate : b.checkInDate;
      return !!target && (!fromDate || target>=fromDate) && (!toDate || target<=toDate);
    })
    .sort((a,b)=> b.checkInDate.localeCompare(a.checkInDate) || (b.checkInTime||'').localeCompare(a.checkInTime||'') || Number(a.roomId)-Number(b.roomId));
}
const REPORT_MODE_LABEL = {month:'ລາຍເດືອນ', checkin:'ວັນທີເຊັກອິນ', checkout:'ວັນທີເຊັກເອົາທ໌', between:'ລະຫວ່າງ'};
// Only money actually received (settlements plus anything not still 'later'), the same rule the
// rest of the app uses -- b.totalPrice alone would count still-unpaid amounts as if collected.
function bookingReceived(bookingId){
  const entries = state.revenueLog.filter(e=>e.bookingId===bookingId && !e.voided && (e.kind==='settle' || entryPaymentType(e)!=='later'));
  const total = entries.reduce((s,e)=>s+e.amount,0);
  const byMethod = m => entries.filter(e=>entryPaymentType(e)===m).reduce((s,e)=>s+e.amount,0);
  return { total, cash:byMethod('cash'), bcel:byMethod('bcel'), ldb:byMethod('ldb'), wechat:byMethod('wechat') };
}

/* ---------------- Modal ---------------- */
function renderModal(){
  if(modal.type==='checkin') return renderCheckinModal();
  if(modal.type==='groupCheckin') return renderGroupCheckinModal();
  if(modal.type==='occupied') return renderOccupiedModal();
  if(modal.type==='cleaning') return renderCleaningModal();
  if(modal.type==='editBooking') return renderEditModal();
  if(modal.type==='groupBill') return renderGroupBillModal();
  return '';
}

  if(!modal.targetCheckout) modal.targetCheckout = addDays(currentDue, 1);
  const extraNights = daysBetween(currentDue, modal.targetCheckout);

  const extraTotal = Math.max(0, extraNights) * b.pricePerNight;
  if(!modal.extraPayStore) modal.extraPayStore = {payMethods:['later'], payAmounts:{}};
  if(!modal.settleStore) modal.settleStore = {payMethods:['cash'], payAmounts:{}};

/* ---------------- Backup / restore (safety net if browser storage is ever cleared) ---------------- */
function exportBackup(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `chanlaya-backup-${todayStr()}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function importBackup(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = migrateState(JSON.parse(reader.result));
      if(!parsed.rooms || !parsed.bookings || !parsed.revenueLog) throw new Error('invalid');
      if(confirm('ນຳເຂົ້າຂໍ້ມູນນີ້ຈະແທນທີ່ຂໍ້ມູນປັດຈຸບັນທັງໝົດ (ທຸກອຸປະກອນ) ຕ້ອງການດຳເນີນການຕໍ່ບໍ?')){
        state = parsed; saveState(); modal=null; view='grid'; render();
      }
    }catch(e){ alert('ໄຟລ໌ນີ້ບໍ່ຖືກຕ້ອງ ບໍ່ສາມາດນຳເຂົ້າໄດ້'); }
  };
  reader.readAsText(file);
}

/* ---------------- Live-patch helpers (avoid destroying focused inputs) ---------------- */
function updateCheckinLive(source){
  if(!modal || modal.type!=='checkin') return;
  const f = modal.form;
  f.receiverName = f.receiverSel==='__other' ? (f.receiverOther||'') : (f.receiverSel||'');
  if(f.ciDate && f.coDate){
    if(source==='nights'){
      f.coDate = addDays(f.ciDate, Math.max(1, parseInt(f.nights,10)||1));
    } else if(source==='codate'){
      const n = daysBetween(f.ciDate, f.coDate);
      if(n<1){ f.coDate = addDays(f.ciDate,1); f.nights=1; } else { f.nights = n; }
    } else if(source==='cidate'){
      f.coDate = addDays(f.ciDate, Math.max(1, parseInt(f.nights,10)||1));
    }
  }
  const nights = Math.max(1, parseInt(f.nights,10)||1);
  const price = Math.max(0, parseInt(f.price,10)||0);
  const total = nights * price;
  const totalEl = document.querySelector('#overlay .total-box .amount');
  if(totalEl) totalEl.textContent = fmtMoney(total);
  const totalLabel = document.querySelector('#overlay .total-box .label');
  if(totalLabel) totalLabel.textContent = `ຍອດລວມທັງໝົດ (${nights} ຄືນ)`;
  const nightsEl = document.getElementById('f-nights');
  if(nightsEl && source!=='nights') nightsEl.value = f.nights;
  const coEl = document.getElementById('f-codate');
  if(coEl && source!=='codate') coEl.value = f.coDate;
  const ciEl = document.getElementById('f-cidate');
  if(ciEl && source!=='cidate') ciEl.value = f.ciDate;
  const coTimeWrap = document.getElementById('f-cotime-wrap');
  const pastNote = document.getElementById('f-paststay-note');
  const pastStay = isPastStay(f);
  if(coTimeWrap) coTimeWrap.style.display = pastStay ? 'flex' : 'none';
  if(pastNote) pastNote.style.display = pastStay ? 'flex' : 'none';
  const wechatWrap = document.getElementById('f-wechat-wrap');
  if(wechatWrap) wechatWrap.style.display = (f.payMethods||[]).includes('wechat') ? 'flex' : 'none';
  // The split boxes are compared against a bill that moves as nights/prices are typed, so the
  // balance line is repainted here rather than waiting for a re-render.
  const payBal = document.getElementById('f-pay-balance');
  if(payBal) payBal.innerHTML = payBalanceHtml(f, total);
  // Patched in here rather than via render(), so the warning appears as the name/document is
  // typed without the full re-render blowing away the field the user is still in.
  const blWarn = document.getElementById('f-blacklist-warn');
  if(blWarn) blWarn.innerHTML = blacklistWarnHtml(f.guestName, f.docNumber);
}

/* ---------------- Event wiring ---------------- */
function attachHandlers(){
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.onclick = ()=>{ view = el.dataset.nav; modal=null; selectMode=false; selectedRooms=[]; searchError=''; render(); };
  });

  const exportBtn = document.getElementById('export-btn');
  if(exportBtn) exportBtn.onclick = exportBackup;

      priceInput.onchange = ()=>{ modal.form.pricePerNight = priceInput.value; render(); };
    }
    bind('ef-checkin-time','checkInTime');
    bind('ef-checkout-real','checkOutDateReal');
    bind('ef-checkout-time','checkOutTimeReal');
    bind('ef-guestname','guestName');
    bind('ef-gender','gender');
    bind('ef-doc','docNumber');
    wireNatAutocomplete('ef-nat','ef-nat-results','nationality');
    bind('ef-phone','phone');
    bind('ef-wechat-amount','wechatAmount');
    // The bill this edit is heading for -- what the split has to add up to, recomputed live because
    // the dates and the price on this same form are what move it.
    const editTotal = ()=>{
      const bk = state.bookings[modal.bookingId];
      const raw = (modal.form.checkInDate && modal.form.checkOutDateExp)
        ? daysBetween(modal.form.checkInDate, modal.form.checkOutDateExp) : bk.nights;
      const n = raw===0 ? 1 : (raw>0 ? raw : bk.nights);
      const p = modal.form.pricePerNight!==undefined ? (parseInt(modal.form.pricePerNight,10)||0) : bk.pricePerNight;
      return n * p;
    };
    wirePayPicker('ef', modal.form, editTotal, {label:'ຮູບແບບການຊຳລະ (ແກ້ໄຂຍ້ອນຫຼັງໄດ້)'}, ()=>render());
    const saveBtn = document.getElementById('m-save-edit');
    if(saveBtn) saveBtn.onclick = ()=>{
      if(modal.form.checkOutDateReal && modal.form.checkInDate &&
         modal.form.checkOutDateReal < modal.form.checkInDate){
        alert('ວັນທີເຊັກເອົາທ໌ຈິງຕ້ອງບໍ່ກ່ອນວັນທີເຊັກອິນ'); return;
      }
      if(modal.form.checkInDate && modal.form.checkOutDateExp){
        const n = daysBetween(modal.form.checkInDate, modal.form.checkOutDateExp);
        if(n < 0){ alert('ວັນທີເຊັກເອົາທ໌ຕ້ອງບໍ່ກ່ອນວັນທີເຊັກອິນ'); return; }
        // Same-day check-in/out is a real case (a guest who stays briefly then leaves, freeing the
        // room for same-day cleaning and re-letting) -- bill it as 1 night rather than rejecting it.
        modal.form.shortStay = (n===0);
        modal.form.nights = n===0 ? 1 : n;
      }
      const pay = payParts(modal.form, editTotal());
      if(pay.error){ alert(pay.error); return; }
      modal.form.payParts = pay.parts;
      modal.form.paymentType = pay.parts.length===1 ? pay.parts[0].method : 'split';
      doSaveEdit(modal.bookingId, modal.form);
    };
    const deleteBtn = document.getElementById('m-delete');
    if(deleteBtn) deleteBtn.onclick = ()=>{
      if(confirm('ລຶບການເຊັກອິນນີ້? ຫ້ອງຈະຖືກເປີດເປັນວ່າງ ແລະ ຍອດເງິນຈະຖືກຫັກອອກຈາກການເງິນ\n\n(ຍັງກູ້ຄືນໄດ້ຈາກ 🗑 ຖັງຂີ້ເຫຍື້ອ ດ້ານເທິງ)')){
        doDeleteBooking(modal.bookingId);
      }
    };
  }
}

/* ---------------- PWA icon / manifest (best-effort "Add to Home Screen") ---------------- */
function setupPWA(){
  try{
    document.getElementById('favicon').setAttribute('href', LOGO_DATA_URI);
    document.getElementById('apple-icon').setAttribute('href', LOGO_DATA_URI);
    const manifest = {
      name:'CHANLAYA — Front Desk', short_name:'CHANLAYA', start_url:'.', display:'standalone',
      background_color:'#1C2420', theme_color:'#1C2420',
      icons:[{src:LOGO_DATA_URI, sizes:'192x192', type:'image/png'}]
    };
    const blob = new Blob([JSON.stringify(manifest)], {type:'application/manifest+json'});
    document.getElementById('manifest-link').setAttribute('href', URL.createObjectURL(blob));
  }catch(e){ console.error('PWA setup failed', e); }
}

setupPWA();
onAuthStateChanged(auth, (user)=>{
  if(user){
    loadState();
  } else {
    firestoreReady = false;
    showLogin();
  }
});
setInterval(()=>{
  const el = document.getElementById('live-clock');
  if(el) el.textContent = nowLiveLabel();
}, 30000);
setInterval(()=>{ if(state) autoExtendOverdueRooms(); }, 5*60*1000);
</script>
